%YAML:1.0
---
# =====================================================================
# 相机内参（视频用）
# 来源：群消息（重投影误差 0.1448px）
# ⚠️ 这一套只适用于 data/videos/armor_record.avi，不要用在图片上！
# =====================================================================
image_width: 1440
image_height: 1080
camera_name: "armor_video"

# 内参矩阵（视频的 fx/fy 比图片大很多，因为视场更窄/焦距更长）
camera_matrix: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [2362.2795952460974, 0.0, 679.17513921636282,
         0.0, 2336.1916035376717, 529.06858905837635,
         0.0, 0.0, 1.0]

# 畸变系数：[k1, k2, p1, p2, k3]
# 视频这套有真实畸变，解算时必须传给 solvePnP / projectPoints，
# 否则画面边缘的装甲板位置会明显偏移。
distortion_coefficients: !!opencv-matrix
  rows: 1
  cols: 5
  dt: d
  data: [-0.098561592108101559, 0.11173066531932681,
         -0.0038352945867108721, -0.0020421443354436304, 0.0]

# ⚠️ 待确认：这组内参 cx*2≈1358、cy*2≈1058，与视频实际分辨率 1440x1080 不完全吻合。
#    可能是标定时的分辨率和录制的分辨率不一致（材料被缩放过）。
#    接入视频流程前先和发内参的学长确认；若确实不一致，
#    需要把 fx,cx 按 1440/1358、fy,cy 按 1080/1058 等比例缩放（或反过来缩放画面）。
